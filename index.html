<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive demonstration login interface built with HTML, CSS, and JavaScript.">
  <title>Login Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="page-title">
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="page-title">Sign in to your account</h1>
      <p class="intro">Enter your details below to continue.</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="you@example.com" required>
          <small class="field-error" id="email-error"></small>
        </div>

        <div class="form-field">
          <div class="label-row">
            <label for="password">Password</label>
            <button class="text-button" type="button" id="toggle-password"
                    aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="Enter your password" required>
          <small class="field-error" id="password-error"></small>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
        </div>

        <button class="submit-button" type="submit">Sign in <span aria-hidden="true"></span></button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
  </main>
</body>
</html>
